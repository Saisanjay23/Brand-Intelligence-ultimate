# Run from the repo root with: pytest
#
# Scope: backend/tests only, and deliberately only PURE logic -- scoring,
# matching, cap resolution, job eviction, failure classification, proxy
# validation. Nothing here touches MongoDB, the network, or a browser, so
# the whole suite runs in under two seconds and can be run on every save.
#
# That boundary is the point. The bugs this suite exists to catch were all
# silent ones in pure functions (a scoring rubric disagreeing with itself, a
# precedence order contradicting its own docstring, an off-by-one ceiling) --
# they never raised, so only an assertion could find them. Live scraping is
# verified separately against the real platforms, because a mock of
# Facebook's GraphQL response only ever proves the mock still matches itself.
[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
addopts = -q --strict-markers
